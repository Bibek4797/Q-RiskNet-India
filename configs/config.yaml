project:
  name: "Q-RiskNet India"
  version: "1.1.0"
  description: "Equation-by-Equation Quantile Risk, Spillover Connectedness, and Portfolio Risk Analytics Platform for NSE India"

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  external_data: "data/external"
  reports_dir: "reports"
  models_dir: "models"
  outputs_dir: "outputs"
  logs_dir: "logs"

data:
  default_start_years: 5
  tickers:
    "Nifty 50": "^NSEI"
    "Nifty Bank": "^NSEBANK"
    "Nifty IT": "^CNXIT"
    "Nifty Pharma": "^CNXPHARMA"
    "Nifty Auto": "^CNXAUTO"
    "Nifty FMCG": "^CNXFMCG"
    "Nifty Metal": "^CNXMETAL"
    "Nifty Energy": "^CNXENERGY"
    "Nifty Realty": "^CNXREALTY"
    "Nifty Financial Services": "NIFTY_FIN_SERVICE.NS"
  default_sectors:
    - "Nifty 50"
    - "Nifty Bank"
    - "Nifty IT"
    - "Nifty Pharma"
    - "Nifty Auto"
    - "Nifty FMCG"
    - "Nifty Metal"

data_pipeline:
  rolling_short_window: 20
  rolling_long_window: 60
  export_format: "csv"
  missing_tolerance_pct: 0.05
  # Note: Outliers are preserved raw for authentic tail-risk research

models:
  qvar:
    default_lags: 2
    default_quantile: 0.50
    min_lags: 1
    max_lags: 5
  quantile_lstm:
    default_seq_len: 5
    default_epochs: 40
    default_learning_rate: 0.01
    early_stopping: true
    patience: 5
    hidden_dim: "auto"
    val_ratio: 0.15

tail_risk:
  confidence_levels: [0.95, 0.99]

portfolio:
  max_weight: 0.40
  min_weight: 0.00
  risk_free_rate: 0.06

garch:
  vol_model: "Garch"
  p: 1
  o: 1
  q: 1
  dist: "normal"

girf:
  default_horizon: 10
  shock_std_multiplier: 2.0

dashboard:
  page_title: "Q-RiskNet India | Systemic Risk Analytics Platform"
  page_icon: "📡"
  layout: "wide"
  initial_sidebar_state: "expanded"
  theme:
    primary_color: "#6366f1"
    secondary_color: "#a78bfa"
    background_color: "#050914"
    card_background: "#0d1526"
    text_color: "#e2e8f0"
