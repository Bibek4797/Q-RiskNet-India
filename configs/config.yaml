project:
  name: "Q-RiskNet India"
  version: "1.0.0"
  description: "Enterprise Quantile-LSTM Deep Learning & Financial Network Topology Platform for NSE India"

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  external_data: "data/external"
  reports_dir: "reports"
  models_dir: "models"
  outputs_dir: "outputs"
  logs_dir: "logs"

data:
  default_start_years: 5
  tickers:
    "Nifty 50": "^NSEI"
    "Nifty Bank": "^NSEBANK"
    "Nifty IT": "^CNXIT"
    "Nifty Pharma": "^CNXPHARMA"
    "Nifty Auto": "^CNXAUTO"
    "Nifty FMCG": "^CNXFMCG"
    "Nifty Metal": "^CNXMETAL"
    "Nifty Energy": "^CNXENERGY"
    "Nifty Realty": "^CNXREALTY"
    "Nifty Financial Services": "NIFTY_FIN_SERVICE.NS"
  default_sectors:
    - "Nifty 50"
    - "Nifty Bank"
    - "Nifty IT"
    - "Nifty Pharma"
    - "Nifty Auto"
    - "Nifty FMCG"
    - "Nifty Metal"

data_pipeline:
  rolling_short_window: 20
  rolling_long_window: 60
  export_format: "csv"
  missing_tolerance_pct: 0.05
  outlier_std_threshold: 4.0

models:
  qvar:
    default_lags: 2
    default_quantile: 0.50
    min_lags: 1
    max_lags: 5
  quantile_lstm:
    default_seq_len: 5
    default_epochs: 50
    default_learning_rate: 0.01
    early_stopping: true
    patience: 5
    hidden_dim: "auto"

garch:
  vol_model: "Garch"
  p: 1
  o: 1
  q: 1
  dist: "normal"

girf:
  default_horizon: 10
  shock_std_multiplier: 2.0

dashboard:
  page_title: "Q-RiskNet India | Volatility Spillover Dashboard"
  page_icon: "📈"
  layout: "wide"
  initial_sidebar_state: "expanded"
  theme:
    primary_color: "#3b82f6"
    secondary_color: "#8b5cf6"
    background_color: "#0f172a"
    card_background: "#1e293b"
    text_color: "#f8fafc"
    community_colors:
      - "#3b82f6"
      - "#ef4444"
      - "#10b981"
      - "#f59e0b"
      - "#8b5cf6"
      - "#ec4899"
      - "#14b8a6"
      - "#6366f1"
