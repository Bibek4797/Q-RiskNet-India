[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "q-risknet-india"
version = "1.0.0"
description = "Quantile-LSTM Deep Learning & Financial Network Topology Analysis for Indian Stock Markets"
authors = [{ name = "Bibek Rout" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "yfinance>=0.2.35",
    "torch>=2.0.0",
    "statsmodels>=0.14.0",
    "arch>=6.0.0",
    "networkx>=3.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
